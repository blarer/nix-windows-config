name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          gc-max-store-size-linux: 8G

      - name: Flake check
        run: nix flake check

      # The WSL home environment is plain x86_64-linux, so an ubuntu runner
      # can build the exact generation wsl-bootstrap.sh would activate.
      - name: Build the home-manager generation
        run: nix build .#homeConfigurations.wsl.activationPackage --print-build-logs

      - name: Formatting
        run: nix fmt -- --fail-on-change
